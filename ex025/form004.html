<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="Nome" id="inome" autocomplete="name" placeholder="Nome" required>
            </p>
            <p>
                <label for="imail">Email: </label>
                <input type="email" name="Email" id="imail"  required autocomplete="email" placeholder="Email">
            </p>
            <p>
                <label for="itel">Telefone: </label>
                <input type="tel" name="Telefone" id="itel" autocomplete="tel" required placeholder="(xx) x xxxx-xxxx" >
            </p>
        </fieldset>
        <!---estudar mais sobre RegEx-->
        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
