<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
      <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inum">Numero 1: </label>
            <input type="number" name="um" id="inum" min="0" max="50" required 
            oninput="isoma.innerHTML =Number(inum.value)+Number(idoi.value)">
        </p>
        <p>
            <label for="idoi">Numero 2: </label>
            <input type="number" name="dois" id="idoi" min="0" max="50" required oninput="isoma.innerHTML = Number(inum.value)+Number(idoi.value)">
        </p>
        <p>
            <label for="isoma">Soma: </label>
            <output id="isoma">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
