<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Flaxible Box</title>
    <style>
        div.conteiner{

        }
        div#item1{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
           /* flex-basis: 150px;

            flex-grow: 1; */

        div#item2{

            text-align: center;
          /*  flex-basis: 150px;
            flex-shrink: 2;
            flex-grow: 0; */

            flex: 0 2 150px;
            
        }
        div#item3{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            /*flex-basis: 150px;
            flex-shrink: 1;
            flex-grow: 2;*/

            flex: 2 1 150px;
            
        }

</head>

        <div id="item2">B</div>
        <div id="item3">C</div>
