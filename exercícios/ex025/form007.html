<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
     <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
    
        <p>
            <label for="iest">Estados:</label>
            <select name="estados" id="iest">
                <option value="" selected>---Escolha---</option>
                <optgroup label="Região Nordeste">
                    <option value="Pe">Pernambuco</option>
                    <option value="AL">Alagoas</option>
                    <option value="Ba">Bahia</option>
                </optgroup>
                
                <optgroup label="Região Sudeste">
                    <option value="MG"> Minas Gerais</option>]
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof">Profissão</label>
            <input type="text" name="profissão" id="iprof" list="profs">
            <datalist id="profs">
                <option value="Dev">Desenvolvedor</option>
                <option value="Adm">Administração</option>
                <option value="Cin">Cineasta</option>
                <option value="prof">Professor</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem:</label> <br>
            <textarea name="mensagem" id="imsg" cols="30" rows="10"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
