<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        td{
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }
        table{
            border-collapse: collapse;
            width: 300px;
            
        }
    </style>
</head>
<body>
    <h1>Mesclagem de células</h1>

    <table>
        <tr>
            <td>01</td>
            <td>02</td>
            <td colspan="2">03</td>
        
        </tr>
        <tr>
            <td rowspan="2">A1</td>
            <td>A2</td>
            <td>A3</td>
            <td>A4</td>
        </tr>
        <tr>
            
            <td>B2</td>
            <td rowspan="2">B3</td>
            <td>B4</td>
        </tr>
        <tr>
            <td>C1</td>
            <td>C2</td>
            
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
